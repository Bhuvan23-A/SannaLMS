version: '3.3'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sannalms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sannalms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sannalms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: sannalms-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9090:9000"
      - "9091:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: sannalms-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sannalms}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HOSTNAME: localhost
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - postgres

  kong-db:
    image: postgres:15-alpine
    container_name: kong-db
    environment:
      POSTGRES_USER: ${KONG_PG_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
      POSTGRES_DB: ${KONG_PG_DATABASE:-kong}
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.4.0-ubuntu
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    depends_on:
      - kong-db

  kong:
    image: kong:3.4.0-ubuntu
    container_name: sannalms-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8010:8000"
      - "8445:8443"
      - "8011:8001"
      - "8446:8444"
    volumes:
      - ./infrastructure/kong/kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - kong-migrations

  nginx:
    image: nginx:1.25-alpine
    container_name: sannalms-nginx
    ports:
      - "8085:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/saas-web-app/dist:/usr/share/nginx/html:ro
    depends_on:
      - keycloak
      - kong

  # -----------------------------------------------------------------
  # Part 3 Services
  # -----------------------------------------------------------------
  coding-service:
    build:
      context: ./services/part3-assessment-sandbox/coding-service
      dockerfile: Dockerfile
    container_name: sannalms-coding-service
    restart: always
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres

  assessment-service:
    build:
      context: ./services/part3-assessment-sandbox/assessment-service
      dockerfile: Dockerfile
    container_name: sannalms-assessment-service
    restart: always
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SannaLMS_Pass_2026!
      - POSTGRES_DB=sannalms_master
    depends_on:
      - postgres
      - redis

  assignment-service:
    build:
      context: ./services/part3-assessment-sandbox/assignment-service
      dockerfile: Dockerfile
    container_name: sannalms-assignment-service
    restart: always
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SannaLMS_Pass_2026!
      - POSTGRES_DB=sannalms_master
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin_secure
    depends_on:
      - postgres
      - minio

  # ================================================================
  # Part 2 Admin UI (Next.js)
  # ================================================================
  admin-ui:
    build:
      context: ./frontend/admin-ui
      dockerfile: Dockerfile
    container_name: sannalms-admin-ui
    restart: always
    ports:
      - "8086:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - postgres

  # ================================================================
  # Part 4: AI, Analytics & Placements (Python FastAPI)
  # ================================================================
  ai-service:
    build:
      context: ./services/part4-ai-analytics/ai-service
      dockerfile: Dockerfile
    container_name: sannalms-ai-service
    restart: always
    ports:
      - "8008:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  # ================================================================
  # Part 1: Infrastructure, Auth & Identity
  # ================================================================
  auth-service:
    build:
      context: ./services/part1-infra-auth/auth-service
      dockerfile: Dockerfile
    container_name: sannalms-auth-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=sannalms
      - KEYCLOAK_CLIENT_ID=sannalms-api
    depends_on:
      - postgres
      - redis

  user-service:
    build:
      context: ./services/part1-infra-auth/user-service
      dockerfile: Dockerfile
    container_name: sannalms-user-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres

  # ================================================================
  # Part 2: Core LMS Microservices (NestJS)
  # ================================================================
  college-service:
    build:
      context: ./services/part2-core-lms/college-service
      dockerfile: Dockerfile
    container_name: sannalms-college-service
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
    depends_on:
      - postgres

  course-service:
    build:
      context: ./services/part2-core-lms/course-service
      dockerfile: Dockerfile
    container_name: sannalms-course-service
    restart: always
    ports:
      - "3003:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - postgres

  assessment-p2:
    build:
      context: ./services/part2-core-lms/assessment-service
      dockerfile: Dockerfile
    container_name: sannalms-assessment-p2
    restart: always
    ports:
      - "3004:3002"
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
    depends_on:
      - postgres

  attendance-service:
    build:
      context: ./services/part2-core-lms/attendance-service
      dockerfile: Dockerfile
    container_name: sannalms-attendance-service
    restart: always
    ports:
      - "3005:3003"
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
    depends_on:
      - postgres

  calendar-service:
    build:
      context: ./services/part2-core-lms/calendar-service
      dockerfile: Dockerfile
    container_name: sannalms-calendar-service
    restart: always
    ports:
      - "3006:3004"
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
    depends_on:
      - postgres

  certificate-service:
    build:
      context: ./services/part2-core-lms/certificate-service
      dockerfile: Dockerfile
    container_name: sannalms-certificate-service
    restart: always
    ports:
      - "3007:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
    depends_on:
      - postgres

  discussion-service:
    build:
      context: ./services/part2-core-lms/discussion-service
      dockerfile: Dockerfile
    container_name: sannalms-discussion-service
    restart: always
    ports:
      - "3008:3006"
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  liveclass-service:
    build:
      context: ./services/part2-core-lms/liveclass-service
      dockerfile: Dockerfile
    container_name: sannalms-liveclass-service
    restart: always
    ports:
      - "3009:3008"
    environment:
      - PORT=3008
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  notification-service:
    build:
      context: ./services/part2-core-lms/notification-service
      dockerfile: Dockerfile
    container_name: sannalms-notification-service
    restart: always
    ports:
      - "3010:3009"
    environment:
      - PORT=3009
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  search-service:
    build:
      context: ./services/part2-core-lms/search-service
      dockerfile: Dockerfile
    container_name: sannalms-search-service
    restart: always
    ports:
      - "3011:3010"
    environment:
      - PORT=3010
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  kong_data:
  redis_data:
  minio_data:
