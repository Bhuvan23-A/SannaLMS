version: '3.3'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sannalms-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sannalms}
    ports:
      # Host 5433 (5432 is taken by another project on the shared server); services talk internally on 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sannalms-redis
    restart: always
    ports:
      # Host 6380 (6379 is taken by another project on the shared server); services talk internally on 6379
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: sannalms-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9090:9000"
      - "9091:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  keycloak:
    build:
      context: ./infrastructure/keycloak
      dockerfile: Dockerfile
    container_name: sannalms-keycloak
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sannalms}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    command: start-dev --import-realm --http-relative-path=/auth
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./infrastructure/keycloak/themes/sannalms:/opt/keycloak/themes/sannalms
    depends_on:
      - postgres

  kong-db:
    image: postgres:15-alpine
    container_name: kong-db
    restart: always
    environment:
      POSTGRES_USER: ${KONG_PG_USER:-kong}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
      POSTGRES_DB: ${KONG_PG_DATABASE:-kong}
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.4.0-ubuntu
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: ${KONG_PG_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD:-kongpass}
    depends_on:
      - kong-db

  kong:
    image: kong:3.4.0-ubuntu
    container_name: sannalms-kong
    restart: always
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - "8010:8000"
      - "8445:8443"
      - "8011:8001"
      - "8446:8444"
    volumes:
      - ./infrastructure/kong/kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - postgres

  nginx:
    image: nginx:1.25-alpine
    container_name: sannalms-nginx
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/saas-web-app/dist:/usr/share/nginx/html:ro
    depends_on:
      - keycloak
      - kong

  # -----------------------------------------------------------------
  # Part 3 Services
  # -----------------------------------------------------------------
  coding-service:
    build:
      context: ./services/part3-assessment-sandbox/coding-service
      dockerfile: Dockerfile
    container_name: sannalms-coding-service
    restart: always
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres

  assessment-service:
    build:
      context: ./services/part3-assessment-sandbox/assessment-service
      dockerfile: Dockerfile
    container_name: sannalms-assessment-service
    restart: always
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=sannalms_master
    depends_on:
      - postgres
      - redis

  assignment-service:
    build:
      context: ./services/part3-assessment-sandbox/assignment-service
      dockerfile: Dockerfile
    container_name: sannalms-assignment-service
    restart: always
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=sannalms_master
      - MINIO_ENDPOINT=minio
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      - postgres
      - minio

  # ================================================================
  # Part 2 Admin UI (Next.js)
  # ================================================================
  admin-ui:
    build:
      context: ./frontend/admin-ui
      dockerfile: Dockerfile
    container_name: sannalms-admin-ui
    restart: always
    ports:
      - "8086:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_KEYCLOAK_URL=https://sannalms.sannainnovations.com/auth
      - NEXT_PUBLIC_KEYCLOAK_REALM=sannalms
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=sannalms-client
    depends_on:
      - postgres

  # ================================================================
  # Part 4: AI, Analytics & Placements (Python FastAPI)
  # ================================================================
  ai-service:
    build:
      context: ./services/part4-ai-analytics/ai-service
      dockerfile: Dockerfile
    container_name: sannalms-ai-service
    restart: always
    ports:
      - "8008:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Real AI answers need a Google Gemini API key (set in .env). Without one
      # the tutor falls back to the built-in RAG synthesis engine.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      # Real Mongo store for analytics/placements/gamification data — without
      # this the service silently ran on an in-memory fallback that reset on
      # every restart (#fix).
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=lms_production_db
    depends_on:
      - postgres
      - redis
      - mongodb

  # MongoDB backing the Part-4 AI service (analytics, placements, gamification).
  mongodb:
    image: mongo:4.4
    container_name: sannalms-mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ================================================================
  # Part 1: Infrastructure, Auth & Identity
  # ================================================================
  auth-service:
    build:
      context: ./services/part1-infra-auth/auth-service
      dockerfile: Dockerfile
    container_name: sannalms-auth-service
    restart: always
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      - REDIS_URL=redis://redis:6379
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=sannalms
      - KEYCLOAK_CLIENT_ID=sannalms-api
    depends_on:
      - postgres
      - redis

  user-service:
    build:
      context: ./services/part1-infra-auth/user-service
      dockerfile: Dockerfile
    container_name: sannalms-user-service
    restart: always
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_user?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres

  # ================================================================
  # Part 2: Core LMS Microservices (NestJS)
  # ================================================================
  college-service:
    build:
      context: ./services/part2-core-lms/college-service
      dockerfile: Dockerfile
    container_name: sannalms-college-service
    restart: always
    environment:
      - PORT=3000
      # This Keycloak runs with --http-relative-path=/auth, so keep the /auth
      # suffix or Keycloak admin calls (college-admin create, bulk import) 401.
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_REALM=sannalms
      - KEYCLOAK_ADMIN_CLIENT=sannalms-api
      - KEYCLOAK_ADMIN_SECRET=${KEYCLOAK_ADMIN_SECRET:-sannalms-api-svc-local}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_college?schema=public
    depends_on:
      - postgres

  course-service:
    build:
      context: ./services/part2-core-lms/course-service
      dockerfile: Dockerfile
    container_name: sannalms-course-service
    restart: always
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_course?schema=public
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    # Course content uploads (topic PDFs/videos + course resources) must
    # survive container rebuilds/recreates — the files live in /app/uploads.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres

  assessment-p2:
    build:
      context: ./services/part2-core-lms/assessment-service
      dockerfile: Dockerfile
    container_name: sannalms-assessment-p2
    restart: always
    environment:
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_assessment?schema=public
    # Share the course-service uploads volume so assignment files (written under
    # /app/uploads/assignments/) are served by the same /uploads/ nginx route.
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres

  attendance-service:
    build:
      context: ./services/part2-core-lms/attendance-service
      dockerfile: Dockerfile
    container_name: sannalms-attendance-service
    restart: always
    environment:
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_attendance?schema=public
      - COURSE_SERVICE_URL=http://sannalms-course-service:3001
    depends_on:
      - postgres

  calendar-service:
    build:
      context: ./services/part2-core-lms/calendar-service
      dockerfile: Dockerfile
    container_name: sannalms-calendar-service
    restart: always
    environment:
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_calendar?schema=public
    depends_on:
      - postgres

  certificate-service:
    build:
      context: ./services/part2-core-lms/certificate-service
      dockerfile: Dockerfile
    container_name: sannalms-certificate-service
    restart: always
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_certificate?schema=public
    depends_on:
      - postgres

  discussion-service:
    build:
      context: ./services/part2-core-lms/discussion-service
      dockerfile: Dockerfile
    container_name: sannalms-discussion-service
    restart: always
    environment:
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_discussion?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  chat-service:
    build:
      context: ./services/part2-core-lms/chat-service
      dockerfile: Dockerfile
    container_name: sannalms-chat-service
    restart: always
    environment:
      - PORT=3007
      # Persist the chat store on a named volume so messages/rooms/DMs survive
      # container rebuilds and restarts (#chat durability — was /tmp, wiped on
      # every recreate).
      - CHAT_DATA_FILE=/app/data/chat-store.json
    volumes:
      - chat_data:/app/data
    depends_on: []

  liveclass-service:
    build:
      context: ./services/part2-core-lms/liveclass-service
      dockerfile: Dockerfile
    container_name: sannalms-liveclass-service
    restart: always
    environment:
      - PORT=3008
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_liveclass?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  notification-service:
    build:
      context: ./services/part2-core-lms/notification-service
      dockerfile: Dockerfile
    container_name: sannalms-notification-service
    restart: always
    environment:
      - PORT=3009
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms_notification?schema=public
      - REDIS_URL=redis://redis:6379
      - COLLEGE_SERVICE_URL=http://sannalms-college-service:3000
      - COURSE_SERVICE_URL=http://sannalms-course-service:3001
    depends_on:
      - postgres
      - redis

  search-service:
    build:
      context: ./services/part2-core-lms/search-service
      dockerfile: Dockerfile
    container_name: sannalms-search-service
    restart: always
    environment:
      - PORT=3010
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sannalms
      # Global search reads the real course + discussion databases (each service
      # owns its own DB). The old config only pointed at the base `sannalms` DB,
      # so every query failed and search always returned empty (#search-fix).
      - COURSE_DB_URL=postgresql://postgres:postgres@postgres:5432/sannalms_course
      - DISCUSSION_DB_URL=postgresql://postgres:postgres@postgres:5432/sannalms_discussion
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis


volumes:
  postgres_data:
  kong_data:
  redis_data:
  minio_data:
  mongo_data:
  uploads_data:
  chat_data:
