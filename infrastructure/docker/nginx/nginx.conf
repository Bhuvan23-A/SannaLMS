worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Rate Limiting for all APIs
        limit_req zone=api_limit burst=20 nodelay;

        # Keycloak SSO
        location /auth/ {
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Web Application Frontend
        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Part 1 Auth Service API
        location /api/v1/auth {
            proxy_pass http://host.docker.internal:4001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Part 2 Core LMS API
        location /api/v1/lms {
            proxy_pass http://host.docker.internal:4002;
            proxy_set_header Host $host;
        }

        # Part 2 Real-Time Socket.IO
        location /socket.io/ {
            proxy_pass http://host.docker.internal:4002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Part 3 Assessment & Coding Sandbox API
        location /api/v1/assessment {
            proxy_pass http://host.docker.internal:4003;
            proxy_set_header Host $host;
        }

        # Part 4 AI & Analytics API
        location /api/v1/ai {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
        }
    }
}
