user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    map $http_x_forwarded_proto $pass_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $pass_x_forwarded_proto $pass_x_forwarded_port {
        https   443;
        default 80;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    server {
        listen       80;
        server_name  localhost;

        # Use Docker internal DNS resolver for dynamic upstreams
        resolver 127.0.0.11 valid=5s;

        # Serve React Frontend static assets
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Reverse Proxy to Kong API Gateway
        location /api/ {
            set $upstream_kong sannalms-kong;
            proxy_pass http://$upstream_kong:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
        }

        # Course content uploads (PDFs, videos, SCORM) — the course-service
        # serves them statically under /uploads/, so proxy that path through
        # so students can open documents and media attached to lessons.
        location /uploads/ {
            set $upstream_course sannalms-course-service;
            proxy_pass http://$upstream_course:3001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
        }

        # Reverse Proxy to Keycloak
        location /auth/ {
            set $upstream_keycloak sannalms-keycloak;
            proxy_pass http://$upstream_keycloak:8080$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $pass_x_forwarded_port;
            proxy_set_header X-Forwarded-Proto $pass_x_forwarded_proto;
        }

        # Healthcheck
        location /health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
