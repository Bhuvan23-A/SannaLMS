# docker-compose.override.yml — Memory limits + Node.js optimization
# Applied automatically by `docker compose up` alongside docker-compose.yml

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          memory: 128M

  minio:
    deploy:
      resources:
        limits:
          memory: 256M

  mongodb:
    deploy:
      resources:
        limits:
          memory: 256M

  keycloak:
    environment:
      - KC_JAVA_OPTS=-Xms128m -Xmx384m -XX:+UseG1GC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20
    deploy:
      resources:
        limits:
          memory: 512M

  kong-db:
    deploy:
      resources:
        limits:
          memory: 128M

